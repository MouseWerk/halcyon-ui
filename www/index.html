<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Halcyon UI</title>
    <meta name="description" content="Tactile, glowing React components you copy into your project. Dot-matrix icons, soft surfaces, springy motion." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2315161c'/%3E%3Cg fill='%23ffa726'%3E%3Ccircle cx='8' cy='3.5' r='1.2'/%3E%3Ccircle cx='3.5' cy='8' r='1.2'/%3E%3Ccircle cx='12.5' cy='8' r='1.2'/%3E%3Ccircle cx='8' cy='12.5' r='1.2'/%3E%3Ccircle cx='8' cy='8' r='1.2'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      try {
        var t = localStorage.getItem("hc-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
